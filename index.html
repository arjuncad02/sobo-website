<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Restaurant template</title>
<meta name="description" content=""/>
<meta name="theme-color" content="#171310"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link id="gfonts" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#171310; --ink-2:#221a14; --ink-3:#2d231b;
  --marigold:#FDB515; --marigold-deep:#E8950E;
  --chili:#E0300F; --chili-deep:#B41705;
  --mint:#1F8A5B; --mint-deep:#166e47;
  --paper:#FBF3E1; --paper-2:#F2E6C9; --cream:#F8F0DD;
  --muted:#8c7f6a;
  --line:rgba(255,255,255,.12); --line-dk:rgba(23,19,16,.14);
  --poster:"Anton",system-ui,sans-serif;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
  --wrap:1180px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--ink);color:var(--cream);
  font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;line-height:.98;letter-spacing:-.015em}
p{margin:0 0 1rem}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:clamp(1.1rem,4vw,2.4rem)}
.mono{font-family:var(--mono)}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:2px}

/* eyebrow / label */
.eyebrow{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.6rem;color:var(--marigold);margin:0 0 1.1rem
}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--chili);display:inline-block}

/* ---------- checker band (taxi motif) ---------- */
.checker{
  height:16px;width:100%;
  background:
    repeating-conic-gradient(var(--ink) 0% 25%, var(--marigold) 0% 50%) 0 0 / 16px 16px;
}
.checker.thin{height:10px;background-size:10px 10px}

/* ---------- buttons ---------- */
.btn{
  --bg:var(--chili);--fg:#fff;
  font-family:var(--mono);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;
  background:var(--bg);color:var(--fg);padding:.95rem 1.5rem;border-radius:2px;display:inline-flex;
  align-items:center;gap:.55rem;border:2px solid var(--bg);cursor:pointer;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .2s;
  box-shadow:4px 4px 0 var(--chili-deep);
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--chili-deep)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--chili-deep)}
.btn.ghost{--bg:transparent;--fg:var(--cream);border-color:var(--cream);box-shadow:4px 4px 0 rgba(248,240,221,.25)}
.btn.ghost:hover{box-shadow:6px 6px 0 rgba(248,240,221,.25)}
.btn.gold{--bg:var(--marigold);--fg:var(--ink);box-shadow:4px 4px 0 var(--marigold-deep)}
.btn.gold:hover{box-shadow:6px 6px 0 var(--marigold-deep)}
.btn .arr{transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(3px)}

/* ---------- nav ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:.7rem clamp(1.1rem,4vw,2.4rem);
  transition:background .35s var(--ease),box-shadow .35s var(--ease),padding .35s var(--ease);
}
.nav.scrolled{background:rgba(23,19,16,.92);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line);padding-block:.55rem}
.brand{font-family:var(--poster);font-size:1.45rem;letter-spacing:.02em;color:var(--marigold);display:flex;align-items:center;gap:.5rem}
.brand .dot{width:9px;height:9px;background:var(--chili);border-radius:50%;display:inline-block}
.nav-links{display:flex;align-items:center;gap:1.6rem;font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.nav-links a{position:relative;padding:.2rem 0;color:var(--cream);opacity:.85;transition:opacity .2s}
.nav-links a::after{content:"";position:absolute;left:0;bottom:-3px;height:2px;width:0;background:var(--marigold);transition:width .25s var(--ease)}
.nav-links a:hover{opacity:1}.nav-links a:hover::after{width:100%}
.nav-links .btn{padding:.6rem 1.05rem;font-size:.74rem}
.nav-toggle{display:none;background:transparent;border:1.5px solid var(--line);border-radius:6px;
  color:var(--cream);width:42px;height:42px;cursor:pointer;align-items:center;justify-content:center;
  font-size:1.2rem;line-height:1;transition:border-color .2s,background .2s}
.nav-toggle:hover{border-color:var(--marigold)}
.nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;
  transition:opacity .3s var(--ease),visibility .3s;z-index:48}
@media(max-width:820px){
  .nav-toggle{display:inline-flex}
  .nav-links{position:fixed;top:0;right:0;height:100dvh;width:min(80vw,330px);z-index:49;
    flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:.3rem;
    background:var(--ink-2);border-left:1px solid var(--line);padding:5.5rem 1.6rem 2rem;
    transform:translateX(105%);transition:transform .35s var(--ease);overflow-y:auto}
  .nav-links a{font-size:1rem;padding:.7rem 0;width:100%;border-bottom:1px solid var(--line);opacity:.95}
  .nav-links a::after{display:none}
  .nav-links .btn{margin-top:1rem;width:100%;justify-content:center;border-bottom:0;padding:.9rem 1rem;font-size:.82rem}
  body.nav-open{overflow:hidden}
  body.nav-open .nav-links{transform:none}
  body.nav-open .nav-backdrop{opacity:1;visibility:visible}
}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding-top:5rem;overflow:hidden;background:
   radial-gradient(60% 50% at 80% 12%,rgba(253,181,21,.16),transparent 70%),
   radial-gradient(50% 45% at 12% 88%,rgba(224,48,15,.16),transparent 70%),
   var(--ink);
}
.hero .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.hero .g1{width:380px;height:380px;background:var(--marigold);top:-80px;right:-40px}
.hero .g2{width:320px;height:320px;background:var(--chili);bottom:-60px;left:-60px}
.hero-inner{position:relative;z-index:2}
.hero .eyebrow{color:var(--marigold)}
.kicker{font-family:var(--mono);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);opacity:.7}
.hero-title{font-family:var(--poster);color:var(--marigold);line-height:.82;letter-spacing:.01em;
  font-size:clamp(4.6rem,19vw,15rem);text-transform:uppercase;margin:.4rem 0 .2rem;
  text-shadow:7px 7px 0 var(--chili);
}
.hero-sub{font-family:var(--display);font-weight:700;font-size:clamp(1.1rem,3.2vw,1.8rem);
  letter-spacing:.02em;color:var(--cream);text-transform:uppercase}
.hero-lede{max-width:46ch;color:#e9dcc4;font-size:clamp(1.02rem,1.5vw,1.18rem);margin:1.2rem 0 1.8rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.9rem;align-items:center}
.hero-badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.8rem}
.badge{font-family:var(--mono);font-size:.74rem;letter-spacing:.04em;border:1px solid var(--line);
  padding:.45rem .8rem;border-radius:999px;color:#e9dcc4;display:inline-flex;gap:.5rem;align-items:center}
.badge .star{color:var(--marigold)}

/* page-load animation */
.reveal-up{opacity:0;transform:translateY(26px)}
@media (prefers-reduced-motion:no-preference){
  .loaded .anim{animation:rise .9s var(--ease) both}
  .loaded .anim.d1{animation-delay:.08s}.loaded .anim.d2{animation-delay:.18s}
  .loaded .anim.d3{animation-delay:.30s}.loaded .anim.d4{animation-delay:.42s}
  .loaded .anim.d5{animation-delay:.54s}.loaded .anim.d6{animation-delay:.66s}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  .hero-title{clip-path:inset(0 0 110% 0)}
  .loaded .hero-title{animation:wipe 1s var(--ease) .15s both}
  @keyframes wipe{from{clip-path:inset(0 0 110% 0);transform:translateY(20px)}to{clip-path:inset(0 0 -20% 0);transform:none}}
}
@media (prefers-reduced-motion:reduce){.anim,.hero-title{opacity:1!important}}

/* scroll cue */
.scrollcue{position:absolute;bottom:1.3rem;left:50%;transform:translateX(-50%);z-index:2;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:#e9dcc4;opacity:.6;
  display:flex;flex-direction:column;align-items:center;gap:.4rem}
.scrollcue .line{width:1px;height:30px;background:var(--cream);opacity:.5;animation:cue 1.8s var(--ease) infinite}
@keyframes cue{0%,100%{transform:scaleY(.4);opacity:.3;transform-origin:top}50%{transform:scaleY(1);opacity:.7;transform-origin:top}}

/* ---------- marquee (signature) ---------- */
.marquee{background:var(--marigold);color:var(--ink);border-block:3px solid var(--ink);
  overflow:hidden;white-space:nowrap;padding:.7rem 0}
.marquee.alt{background:var(--ink);color:var(--marigold);border-color:var(--marigold)}
.marquee-track{display:inline-flex;gap:2.4rem;align-items:center;
  font-family:var(--poster);font-size:clamp(1.4rem,3.6vw,2.6rem);text-transform:uppercase;letter-spacing:.02em;
  will-change:transform;animation:scroll-x 26s linear infinite}
.marquee.alt .marquee-track{animation-duration:32s;animation-direction:reverse}
.marquee-track span{display:inline-flex;align-items:center;gap:2.4rem}
.marquee-track .sep{color:var(--chili);font-size:.7em}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes scroll-x{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee-track{animation:none}}

/* ---------- sections ---------- */
section{position:relative}
.pad{padding-block:clamp(3.8rem,8vw,7rem)}
.sec-head{max-width:62ch;margin-bottom:2.6rem}
.sec-head h2{font-size:clamp(2.2rem,6vw,4rem);text-transform:uppercase}
.sec-head .blz{color:var(--chili)}
.sec-head p{color:var(--muted);font-size:1.1rem;margin-top:1rem;max-width:54ch}
.on-paper{background:var(--paper);color:var(--ink-2)}
.on-paper .eyebrow{color:var(--chili-deep)}
.on-paper .eyebrow::before{background:var(--mint)}
.on-paper .sec-head p{color:#6b5f4d}
.on-mar{background:var(--marigold);color:var(--ink)}

/* scroll reveal */
.sr{opacity:0;transform:translateY(28px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.sr.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.sr{opacity:1;transform:none;transition:none}}

/* ---------- menu: category nav ---------- */
.cat-nav{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2.4rem}
@media(max-width:680px){
  .cat-nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    margin-inline:calc(-1*clamp(1.1rem,4vw,2.4rem));padding-inline:clamp(1.1rem,4vw,2.4rem);
    scroll-snap-type:x proximity;scrollbar-width:none}
  .cat-nav::-webkit-scrollbar{display:none}
}
.cat-nav a{flex:none;scroll-snap-align:start;font-family:var(--mono);font-size:.72rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);background:var(--paper-2);
  border:1.5px solid rgba(23,19,16,.14);border-radius:999px;padding:.5rem .9rem;white-space:nowrap;
  transition:background .2s,color .2s,border-color .2s,transform .2s}
.cat-nav a:hover{background:var(--ink);color:var(--cream);border-color:var(--ink);transform:translateY(-2px)}

/* ---------- menu: category blocks ---------- */
.cat-block{margin-bottom:2.8rem;scroll-margin-top:90px}
.cat-block:last-of-type{margin-bottom:0}
.cat-title{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}
.cat-title span{font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--chili-deep);white-space:nowrap}
.cat-title::after{content:"";flex:1;height:0;border-top:2px dashed rgba(23,19,16,.18)}

.dish-list{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
@media(max-width:760px){.dish-list{grid-template-columns:1fr}}

.dish{position:relative;display:flex;gap:1rem;background:var(--cream);border:2px solid var(--ink);
  border-radius:6px;padding:1.05rem 1.1rem;overflow:hidden;
  transition:transform .28s var(--ease),box-shadow .28s var(--ease);box-shadow:5px 5px 0 rgba(23,19,16,.10)}
.dish:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--chili)}
.dish-body{flex:1;min-width:0;display:flex;flex-direction:column}
.dish-top{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;margin-bottom:.35rem}
.dish-name{font-family:var(--display);font-weight:700;font-size:1.18rem;color:var(--ink);line-height:1.08}
.dish-price{flex:none;font-family:var(--mono);font-weight:700;font-size:.92rem;color:var(--chili-deep)}
.dish-desc{color:#6b5f4d;font-size:.88rem;line-height:1.45;margin:0 0 .6rem;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dish-meta{margin-top:auto;display:flex;align-items:center;gap:.7rem}
.veg,.nonveg{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.66rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.veg::before{content:"";width:12px;height:12px;border:2px solid var(--mint);border-radius:3px;
  background:radial-gradient(circle,var(--mint) 0 38%,transparent 40%)}
.nonveg::before{content:"";width:12px;height:12px;border:2px solid var(--chili);border-radius:3px;
  background:radial-gradient(circle,var(--chili) 0 38%,transparent 40%)}
.dish-thumb{flex:none;width:104px;height:104px;border-radius:5px;overflow:hidden;align-self:center;
  background:var(--paper-2);border:1px solid rgba(23,19,16,.12)}
.dish-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
.dish:hover .dish-thumb img{transform:scale(1.07)}
.soldout{opacity:.55}
.soldout .dish-price{color:var(--muted)}
.tag{position:absolute;top:0;left:0;background:var(--chili);color:#fff;font-family:var(--mono);
  font-size:.58rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.25rem .55rem;border-bottom-right-radius:6px;z-index:2}
@media(max-width:420px){
  .dish-thumb{width:80px;height:80px}
  .dish-name{font-size:1.05rem}
}
.menu-foot{margin-top:2.6rem;display:flex;flex-wrap:wrap;gap:.9rem;align-items:center}
.menu-foot .note{font-family:var(--mono);font-size:.78rem;color:var(--muted)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:4px;overflow:hidden}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--ink);padding:1.8rem 1.3rem;text-align:center}
.stat .n{font-family:var(--poster);font-size:clamp(2.4rem,6vw,3.6rem);color:var(--marigold);line-height:1}
.stat .l{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#e9dcc4;opacity:.75;margin-top:.5rem}
.stat .star{color:var(--chili)}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(2rem,5vw,4rem);align-items:center}
@media(max-width:840px){.about-grid{grid-template-columns:1fr}}
.about h2{font-size:clamp(2.2rem,6vw,4.2rem);text-transform:uppercase;color:var(--ink)}
.about p{color:#3a2f24;font-size:1.08rem;max-width:50ch}
.about .big-quote{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--ink);line-height:1.3;
  border-left:4px solid var(--chili);padding-left:1.1rem;margin-top:1.5rem}
.ticket{background:var(--ink);color:var(--cream);border-radius:6px;padding:1.6rem;position:relative;
  box-shadow:10px 10px 0 var(--chili)}
.ticket::before,.ticket::after{content:"";position:absolute;width:26px;height:26px;background:var(--marigold);border-radius:50%}
.ticket::before{left:-13px;top:50%;transform:translateY(-50%)}
.ticket::after{right:-13px;top:50%;transform:translateY(-50%)}
.ticket h3{font-family:var(--poster);color:var(--marigold);font-size:1.5rem;letter-spacing:.02em;margin-bottom:1rem}
.ticket ul{list-style:none;margin:0;padding:0}
.ticket li{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px dashed var(--line);
  font-family:var(--mono);font-size:.84rem}
.ticket li:last-child{border-bottom:0}
.ticket li b{color:var(--marigold);font-weight:700}

/* ---------- reviews ---------- */
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
@media(max-width:900px){.rev-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.rev-grid{grid-template-columns:1fr}}
.rev{background:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:1.5rem;
  transition:transform .3s var(--ease),border-color .3s var(--ease)}
.rev:hover{transform:translateY(-4px);border-color:var(--marigold)}
.rev .stars{color:var(--marigold);letter-spacing:.1em;font-size:.95rem;margin-bottom:.7rem}
.rev p{color:#ece0c9;font-size:1rem;font-style:italic;margin:0 0 1rem}
.rev .who{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;color:#e9dcc4;opacity:.75}
.rev .who b{color:var(--marigold);font-weight:700;font-style:normal}

/* ---------- order channels ---------- */
.order-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
@media(max-width:760px){.order-grid{grid-template-columns:1fr}}
.chan{display:flex;flex-direction:column;gap:.5rem;background:var(--ink-2);border:2px solid var(--line);
  border-radius:6px;padding:1.5rem;transition:transform .3s var(--ease),border-color .3s var(--ease),background .3s var(--ease)}
.chan:hover{transform:translateY(-5px);border-color:var(--marigold);background:var(--ink-3)}
.chan .ct{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--marigold)}
.chan h3{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--cream);line-height:1.05}
.chan p{color:#cbbfa8;font-size:.92rem;margin:.2rem 0 1rem}
.chan .go{margin-top:auto;font-family:var(--mono);font-weight:700;font-size:.8rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--marigold);display:inline-flex;align-items:center;gap:.5rem;transition:gap .25s var(--ease)}
.chan:hover .go{gap:.9rem}
.chan.feature{background:var(--chili);border-color:var(--chili)}
.chan.feature:hover{background:var(--chili-deep);border-color:var(--marigold)}
.chan.feature .ct,.chan.feature .go{color:#ffe6b0}
.chan.feature p{color:#ffd9c7}
.order-note{font-family:var(--mono);font-size:.78rem;color:#cbbfa8;margin-top:1.6rem;text-align:center}

/* ---------- visit ---------- */
.visit-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,3rem);align-items:stretch}
@media(max-width:840px){.visit-grid{grid-template-columns:1fr}}
.info-row{display:flex;gap:1rem;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.info-row:last-of-type{border-bottom:0}
.info-row .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink-3);display:grid;place-items:center;color:var(--marigold)}
.info-row .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#e9dcc4;opacity:.6}
.info-row .v{font-size:1.05rem;color:var(--cream);margin-top:.15rem}
.info-row a.v:hover{color:var(--marigold)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.4rem 0}
.chip{font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;
  padding:.42rem .8rem;color:#e9dcc4;display:inline-flex;gap:.45rem;align-items:center}
.chip.pride{border-color:transparent;background:linear-gradient(90deg,#e0300f,#fdb515,#1f8a5b,#1f6fae,#7a3fa0);color:#fff;font-weight:700}
.map{border:2px solid var(--ink);border-radius:6px;overflow:hidden;min-height:360px;box-shadow:10px 10px 0 var(--marigold)}

      '<div class="visit-grid"><div class="sr">'+
        '<div class="info-row"><div class="ic">📍</div><div><div class="k">Address</div>'+
          '<a class="v" href="'+v.mapsDir+'" target="_blank" rel="noopener">'+v.address+'</a></div></div>'+
        '<div class="info-row"><div class="ic">🕒</div><div><div class="k">Hours</div><div class="v">'+v.hours+'</div></div></div>'+
        '<div class="info-row"><div class="ic">📞</div><div><div class="k">Phone</div><a class="v" href="tel:'+v.phoneTel+'">'+v.phoneDisplay+'</a></div></div>'+
        '<div class="info-row"><div class="ic">🌐</div><div><div class="k">Online</div><a class="v" href="'+v.websiteUrl+'" target="_blank" rel="noopener">'+v.websiteLabel+'</a></div></div>'+
        '<div class="chips">'+v.services.map(function(s){return '<span class="chip">'+s+'</span>';}).join('')+
          (v.pride?'<span class="chip pride">🏳️‍🌈 LGBTQ+ friendly</span>':'')+'</div>'+
        '<div class="hero-cta"><a class="btn" href="'+C.hero.ctaPrimary.url+'" target="_blank" rel="noopener">Order online <span class="arr">→</span></a>'+
          '<a class="btn gold" href="'+v.mapsDir+'" target="_blank" rel="noopener">Directions</a></div>'+
      '</div>'+
      '<div class="map sr"><iframe title="Map to '+C.brand.name+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade" '+
        'src="https://www.google.com/maps?q='+encodeURIComponent(v.mapQuery)+'&output=embed"></iframe></div>'+
      '</div></div>');

    var f=C.footer, yr=new Date().getFullYear();
    set('foot','<div class="wrap"><div class="foot-top">'+
      '<div><a class="brand" href="#top">'+brandMark()+'<span class="dot"></span></a><p>'+f.blurb+'</p></div>'+
      '<div class="foot-links">'+f.columns.map(function(col){
        return '<div class="foot-col"><h4>'+col.title+'</h4>'+col.links.map(function(l){
          return '<a href="'+l.href+'"'+(l.blank?' target="_blank" rel="noopener"':'')+'>'+l.label+'</a>';
        }).join('')+'</div>';
      }).join('')+'</div></div>'+
      '<div class="foot-bottom"><span>'+f.bottomLeft.replace('{year}',yr)+'</span><span>'+f.bottomRight.replace('{year}',yr)+'</span></div></div>');
  }

  /* ---- interactions ---- */
  function init(){
    requestAnimationFrame(function(){document.body.classList.add('loaded');});
    var nav=document.getElementById('nav');
    var onScroll=function(){nav.classList.toggle('scrolled',window.scrollY>30);};
    onScroll();window.addEventListener('scroll',onScroll,{passive:true});

    /* mobile nav drawer */
    var toggle=nav.querySelector('.nav-toggle');
    var backdrop=nav.querySelector('.nav-backdrop');
    var links=nav.querySelector('.nav-links');
    function setMenu(open){
      document.body.classList.toggle('nav-open',open);
      if(toggle)toggle.setAttribute('aria-expanded',open?'true':'false');
      if(toggle)toggle.innerHTML=open?'✕':'☰';
    }
    if(toggle){
      toggle.addEventListener('click',function(){setMenu(!document.body.classList.contains('nav-open'));});
      if(backdrop)backdrop.addEventListener('click',function(){setMenu(false);});
      links.addEventListener('click',function(e){if(e.target.tagName==='A')setMenu(false);});
      document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false);});
    }

    var srs=document.querySelectorAll('.sr');
    if(rm||!('IntersectionObserver' in window)){
      srs.forEach(function(el){el.classList.add('in');});
    }else{
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){
          if(e.isIntersecting){
            var sib=Array.prototype.slice.call(e.target.parentNode.children).indexOf(e.target);
            e.target.style.transitionDelay=Math.min(sib,6)*60+'ms';
            e.target.classList.add('in');io.unobserve(e.target);
          }
        });
      },{threshold:.16,rootMargin:'0px 0px -8% 0px'});
      srs.forEach(function(el){io.observe(el);});
    }

    var counted=false, statWrap=document.querySelector('.stats');
    function runCount(){
      if(counted)return;counted=true;
      document.querySelectorAll('[data-count]').forEach(function(el){
        var target=parseFloat(el.getAttribute('data-count'));
        var dec=parseInt(el.getAttribute('data-dec')||'0',10);
        if(rm){el.textContent=target.toFixed(dec);return;}
        var start=performance.now(),dur=1300;
        (function tick(now){
          var p=Math.min((now-start)/dur,1),eased=1-Math.pow(1-p,3);
          el.textContent=(target*eased).toFixed(dec);
          if(p<1)requestAnimationFrame(tick);else el.textContent=target.toFixed(dec);
        })(start);
      });
    }
    if(statWrap){
      if(rm||!('IntersectionObserver' in window)){runCount();}
      else{var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){runCount();io2.disconnect();}});},{threshold:.4});io2.observe(statWrap);}
    }
  }

  applyTheme();
  render();
  init();
})();
</script>
</body>
</html>
